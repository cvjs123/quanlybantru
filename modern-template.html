<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tên Trang - Hệ Thống Bán Trú</title>
    <link rel="stylesheet" href="phong-o.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="header-left">
                <div class="logo">🏫</div>
                <div class="header-title">
                    <h1>Quản Lý Bán Trú</h1>
                    <p>Hệ thống thông minh</p>
                </div>
            </div>
            <div class="header-right">
                <button class="btn btn-primary btn-small" onclick="window.history.back()">
                    <i class="fas fa-arrow-left"></i> Quay lại
                </button>
            </div>
        </div>
    </div>

    <!-- Page Header -->
    <div class="page-header">
        <h1><i class="fas fa-icon"></i> Tên Trang</h1>
        <p>Trường PTDTBT THCS Hùng Lợi - Năm Học 2025-2026</p>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Card with Content -->
        <div class="card">
            <div class="card-body">
                <h3 style="margin-top: 0; color: #1e3c72;">
                    <i class="fas fa-list"></i> Thông Tin
                </h3>
                
                <!-- Form or Content Here -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Trường</label>
                        <input type="text" placeholder="Nhập thông tin..." />
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="card-footer" style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-primary">
                    <i class="fas fa-save"></i> Lưu
                </button>
                <button class="btn btn-secondary">
                    <i class="fas fa-times"></i> Hủy
                </button>
            </div>

            <!-- Table Section -->
            <div class="card-body" style="border-top: 1px solid rgba(0,0,0,0.08);">
                <h3 style="margin-top: 0; color: #1e3c72;">
                    <i class="fas fa-list"></i> Danh Sách
                </h3>
                <div class="table-wrapper" style="margin-top: 20px;">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>STT</th>
                                <th>Tên</th>
                                <th>Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>Ví dụ</td>
                                <td>
                                    <div class="action-buttons">
                                        <button class="btn-action btn-edit">
                                            <i class="fas fa-edit"></i> Sửa
                                        </button>
                                        <button class="btn-action btn-delete">
                                            <i class="fas fa-trash"></i> Xóa
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Your page JavaScript here
    </script>
</body>
</html>
