<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nhà Trường</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0078D4 0%, #005A9E 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: grid;
            grid-template-columns: 1fr;
            gap: 45px;
        }
        h2 {
            color: #0078D4;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #0078D4;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
            padding: 10px 20px;
            background: rgba(0,120,212,0.1);
            border-radius: 10px;
            transition: background 0.3s;
        }
        .back-link:hover {
            background: rgba(0,120,212,0.2);
        }
        .section {
            background: #f8f9fa;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #0078D4;
        }
        .section h3 {
            color: #0078D4;
            font-size: 1.8em;
            margin-bottom: 30px;
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 0.8px;
        }
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        input, select, textarea {
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #ffffff;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #0078D4;
            box-shadow: 0 0 10px rgba(0,120,212,0.3);
            outline: none;
        }
        textarea {
            grid-column: 1 / -1;
            resize: vertical;
            min-height: 100px;
        }
        button {
            background: linear-gradient(135deg, #0078D4 0%, #005A9E 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            cursor: pointer;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,120,212,0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,120,212,0.4);
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e1e5e9;
        }
        th {
            background: linear-gradient(135deg, #0078D4 0%, #005A9E 100%);
            color: white;
            font-weight: 600;
            font-size: 1em;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        tr:hover {
            background-color: #e3f2fd;
        }
        .btn-delete {
            background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.9em;
            transition: transform 0.2s;
        }
        .btn-delete:hover {
            transform: scale(1.05);
        }
        .logo-wrapper {
            position: relative;
            cursor: pointer;
            margin: 15px auto 0;
            background: #fff;
            border: none;
            display: inline-block;
            overflow: hidden;
            box-sizing: border-box;
            line-height: 0;
            width: 185px;
            height: 185px;
        }
        .logo-wrapper:hover {
            background: #f0f8ff;
        }
        .logo-preview {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }
        .logo-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0078D4;
            font-weight: 600;
            text-align: center;
            padding: 6px 4px;
            white-space: pre-wrap;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85em;
        }
        .info-logo-grid {
            display: grid;
            grid-template-columns: 0.36fr 0.64fr;
            gap: 50px;
            align-items: start;
        }
        .logo-side {
            background: transparent;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            text-align: center;
        }
        .logo-side h4 {
            display: none;
        }
        .logo-side button {
            display: block;
            margin: 12px auto 0;
            padding: 10px 20px;
            font-size: 0.95em;
        }
        @media (max-width: 768px) {
            .info-logo-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Quay lại Trang Chủ</a>
    <h2><i class="fas fa-school"></i> Quản Lý Nhà Trường</h2>

    <!-- Thông tin và Logo -->
    <div class="section info-logo-section">
        <h3>Thông Tin Nhà Trường & Logo</h3>
        <div class="info-logo-grid">
            <div class="logo-side">
                <label for="logoUpload" class="logo-label">Upload School Logo</label>
                <input 
                  type="file" 
                  id="logoUpload" 
                  accept="image/*" 
                  onchange="previewLogo()" 
                  class="hidden-input"
                  aria-label="Upload school logo">
                <div class="logo-wrapper" onclick="document.getElementById('logoUpload').click()">
                    <img id="logoPreview" class="logo-preview" alt="Logo Trường">
                    <div id="logoPlaceholder" class="logo-placeholder">Click để thay logo</div>
                </div>
                <button onclick="saveLogo()">Lưu Logo</button>
            </div>
            <div class="info-side">
                <div class="form-group">
                    <input type="text" id="schoolName" placeholder="Tên Trường">
                    <input type="text" id="schoolAddress" placeholder="Địa Chỉ">
                    <input type="text" id="schoolPhone" placeholder="Điện Thoại">
                    <input type="email" id="schoolEmail" placeholder="Email">
                    <input type="text" id="schoolFounded" placeholder="Năm thành lập">
                    <input type="text" id="schoolPrincipal" placeholder="Hiệu trưởng">
                    <input type="text" id="schoolStudentCount" placeholder="Số học sinh">
                    <input type="text" id="schoolWebsite" placeholder="Website">
                </div>
                <br><br>
                <button onclick="saveSchoolInfo()">Lưu Thông Tin</button>
            </div>
        </div>
    </div>

    <!-- Danh sách CBGV -->
    <div class="section">
        <h3>Danh Sách Cán Bộ Giáo Viên</h3>
        <div class="form-group">
            <input type="text" id="teacherID" placeholder="Mã CBGV">
            <input type="text" id="teacherName" placeholder="Họ và Tên">
            <input type="text" id="teacherSubject" placeholder="Môn Học">
            <input type="text" id="teacherPhone" placeholder="Điện Thoại">
            <input type="text" id="teacherRoom" placeholder="Phụ trách phòng">
            <button id="addTeacherButton" onclick="addTeacher()">Thêm CBGV</button>
        </div>
        <input type="file" id="excelUpload" accept=".xlsx,.xls" onchange="importFromExcel()">
        <label for="excelUpload"> Chọn file Excel để import</label>
        <br>
        <button onclick="exportTemplate()">Xuất File Mẫu Excel</button>
        <button onclick="updateTeacherList()">Cập nhật</button>
        <br><br>
        <table id="teacherTable">
            <thead>
                <tr>
                    <th>Mã CBGV</th>
                    <th>Họ Tên</th>
                    <th>Môn Học</th>
                    <th>Điện Thoại</th>
                    <th>Phụ trách phòng</th>
                    <th>Thao Tác</th>
                </tr>
            </thead>
            <tbody id="teacherData"></tbody>
        </table>
    </div>
</div>

<script>
    let editingIndex = null;

    // BroadcastChannel cho cập nhật thời gian thực
    const channel = new BroadcastChannel('schoolDataUpdates');

    // Load data on page load
    window.onload = function() {
        loadSchoolInfo();
        loadLogo();
        loadTeachers();
        displayTeachers();
    };

    // Save school info
    function saveSchoolInfo() {
        const info = {
            name: document.getElementById('schoolName').value,
            address: document.getElementById('schoolAddress').value,
            phone: document.getElementById('schoolPhone').value,
            email: document.getElementById('schoolEmail').value,
            founded: document.getElementById('schoolFounded').value,
            principal: document.getElementById('schoolPrincipal').value,
            studentCount: document.getElementById('schoolStudentCount').value,
            website: document.getElementById('schoolWebsite').value
        };
        localStorage.setItem('schoolInfo', JSON.stringify(info));
        alert('Đã lưu thông tin nhà trường!');
    }

    // Load school info
    function loadSchoolInfo() {
        const info = JSON.parse(localStorage.getItem('schoolInfo')) || {};
        document.getElementById('schoolName').value = info.name || '';
        document.getElementById('schoolAddress').value = info.address || '';
        document.getElementById('schoolPhone').value = info.phone || '';
        document.getElementById('schoolEmail').value = info.email || '';
        document.getElementById('schoolFounded').value = info.founded || '';
        document.getElementById('schoolPrincipal').value = info.principal || '';
        document.getElementById('schoolStudentCount').value = info.studentCount || '';
        document.getElementById('schoolWebsite').value = info.website || '';
    }

    function updateLogoDisplay(logo) {
        const preview = document.getElementById('logoPreview');
        const placeholder = document.getElementById('logoPlaceholder');
        if (logo) {
            preview.src = logo;
            preview.style.display = 'block';
            placeholder.style.display = 'none';
        } else {
            preview.style.display = 'none';
            placeholder.style.display = 'block';
        }
    }

    // Preview logo
    function previewLogo() {
        const file = document.getElementById('logoUpload').files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                updateLogoDisplay(e.target.result);
            };
            reader.readAsDataURL(file);
        }
    }

    // Save logo
    function saveLogo() {
        const file = document.getElementById('logoUpload').files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem('schoolLogo', e.target.result);
                alert('Đã lưu logo!');
            };
            reader.readAsDataURL(file);
        }
    }

    // Load logo
    function loadLogo() {
        const logo = localStorage.getItem('schoolLogo');
        updateLogoDisplay(logo);
    }

    // Load teachers with sample data if empty
    function loadTeachers() {
        let teachers = JSON.parse(localStorage.getItem('teachers')) || [];
        if (teachers.length === 0) {
            teachers = [
                { id: 'CBGV001', name: 'Nguyễn Văn A', subject: 'Toán', phone: '0123456789', room: 'Phòng 101' }
            ];
            localStorage.setItem('teachers', JSON.stringify(teachers));
        }
    }

    // Add or update teacher
    function addTeacher() {
        const id = document.getElementById('teacherID').value;
        const name = document.getElementById('teacherName').value;
        const subject = document.getElementById('teacherSubject').value;
        const phone = document.getElementById('teacherPhone').value;
        const room = document.getElementById('teacherRoom').value;

        if (!id || !name || !subject || !phone) {
            alert("Vui lòng nhập đầy đủ thông tin!");
            return;
        }

        let teachers = JSON.parse(localStorage.getItem('teachers')) || [];
        const teacher = { id, name, subject, phone, room, image: '', email: `${name.toLowerCase().replace(/\s+/g, '.')}@school.edu.vn` };

        if (editingIndex !== null) {
            teachers[editingIndex] = teacher;
            editingIndex = null;
            document.getElementById('addTeacherButton').textContent = 'Thêm CBGV';
        } else {
            teachers.push(teacher);
        }

        localStorage.setItem('teachers', JSON.stringify(teachers));

        channel.postMessage({ type: 'teacherUpdated' });

        // Clear form
        document.getElementById('teacherID').value = '';
        document.getElementById('teacherName').value = '';
        document.getElementById('teacherSubject').value = '';
        document.getElementById('teacherPhone').value = '';
        document.getElementById('teacherRoom').value = '';

        displayTeachers();
    }

    function editTeacher(index) {
        const teachers = JSON.parse(localStorage.getItem('teachers')) || [];
        const teacher = teachers[index];
        if (!teacher) return;

        document.getElementById('teacherID').value = teacher.id;
        document.getElementById('teacherName').value = teacher.name;
        document.getElementById('teacherSubject').value = teacher.subject;
        document.getElementById('teacherPhone').value = teacher.phone;
        document.getElementById('teacherRoom').value = teacher.room;
        document.getElementById('addTeacherButton').textContent = 'Cập nhật CBGV';
        editingIndex = index;
    }

    // Display teachers
    function displayTeachers() {
        const teacherData = document.getElementById('teacherData');
        teacherData.innerHTML = '';
        let teachers = JSON.parse(localStorage.getItem('teachers')) || [];

        teachers.forEach((t, index) => {
            teacherData.innerHTML += `
                <tr>
                    <td>${t.id}</td>
                    <td>${t.name}</td>
                    <td>${t.subject}</td>
                    <td>${t.phone}</td>
                    <td>${t.room}</td>
                    <td>
                        <button class="btn-delete" onclick="editTeacher(${index})">Sửa</button>
                        <button class="btn-delete" onclick="deleteTeacher(${index})">Xóa</button>
                    </td>
                </tr>
            `;
        });
    }

    // Delete teacher
    function deleteTeacher(index) {
        let teachers = JSON.parse(localStorage.getItem('teachers')) || [];
        teachers.splice(index, 1);
        localStorage.setItem('teachers', JSON.stringify(teachers));
        channel.postMessage({ type: 'teacherUpdated' });
        displayTeachers();
    }

    // Import from Excel
    function importFromExcel() {
        const file = document.getElementById('excelUpload').files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                let teachers = JSON.parse(localStorage.getItem('teachers')) || [];
                jsonData.forEach(row => {
                    if (row['Mã CBGV'] && row['Họ Tên'] && row['Môn Học'] && row['Điện Thoại']) {
                        teachers.push({
                            id: row['Mã CBGV'],
                            name: row['Họ Tên'],
                            subject: row['Môn Học'],
                            phone: row['Điện Thoại'],
                            room: row['Phụ trách phòng'] || '',
                            image: '',
                            email: `${row['Họ Tên'].toLowerCase().replace(/\s+/g, '.')}@school.edu.vn`
                        });
                    }
                });
                localStorage.setItem('teachers', JSON.stringify(teachers));
                channel.postMessage({ type: 'teacherUpdated' });
                displayTeachers();
                alert('Đã import dữ liệu từ Excel!');
            };
            reader.readAsArrayBuffer(file);
        }
    }

    // Export template Excel
    function exportTemplate() {
        const data = [
            ['Mã CBGV', 'Họ Tên', 'Môn Học', 'Điện Thoại', 'Phụ trách phòng'],
            ['CBGV001', 'Nguyễn Văn A', 'Toán', '0123456789', 'Phòng 101']
        ];
        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Template');
        XLSX.writeFile(wb, 'mau_danh_sach_cbgv.xlsx');
    }

    // Update teacher list display
    function updateTeacherList() {
        displayTeachers();
        alert('Đã cập nhật danh sách CBGV!');
    }

    // Lắng nghe cập nhật từ các tab khác
    channel.onmessage = function(e) {
        if (e.data.type === 'teacherUpdated') {
            loadTeachers();
            displayTeachers();
        }
    };
</script>

</body>
</html>
